{% extends "base.html" %}

{% block title %}
Edit Student | SRMS
{% endblock %}

{% block page_title %}
Edit Student
{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">

        <h2>Edit Student</h2>

        <p>
            Update the student information.
        </p>

    </div>


    <form method="POST" class="data-form">

        <div class="form-grid">

            <div class="form-group">

                <label>Student Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ student.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ student.phone }}"
                >

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    name="department"
                    value="{{ student.department }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Year</label>

                <select name="year" required>

                    <option value="1" {% if student.year == 1 %}selected{% endif %}>
                        1st Year
                    </option>

                    <option value="2" {% if student.year == 2 %}selected{% endif %}>
                        2nd Year
                    </option>

                    <option value="3" {% if student.year == 3 %}selected{% endif %}>
                        3rd Year
                    </option>

                    <option value="4" {% if student.year == 4 %}selected{% endif %}>
                        4th Year
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('students') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button type="submit" class="primary-button">
                Update Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
